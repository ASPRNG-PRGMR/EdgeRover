<svg width="100%" viewBox="0 0 1100 760" role="img" xmlns="http://www.w3.org/2000/svg"><title>EdgeRover power wiring diagram</title><desc>Simplified power wiring reference: 12V pack through a fuse splits to a 5A BEC (feeding TB6612FNG VCC) and directly to VM; TB6612FNG drives left and right motor pairs. A separate 6V NiMH pack feeds the ESP32 VIN pin through its onboard regulator. The two domains share only a common ground and PWM/direction signal wires.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1100" height="760" fill="white"/><text x="550.0" y="28" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="rgb(20,20,18)">EdgeRover Power Wiring</text><text x="550.0" y="52" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="rgb(100,98,94)">isolated dual-battery domains — linked only by common ground + signal wires</text><rect x="60" y="78" width="260" height="52" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="190" y="104" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="rgb(30,30,28)">12V battery pack</text><rect x="780" y="78" width="260" height="52" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="910" y="104" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="rgb(30,30,28)">6V pack (4×AA NiMH)</text><path d="M190,130 L190,164" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M910,130 L910,164" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="148" width="400" height="480" rx="18" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="1.3"/><text x="220" y="172" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="rgb(113,43,19)">MOTOR DOMAIN</text><rect x="680" y="148" width="400" height="480" rx="18" fill="rgb(227,238,250)" stroke="rgb(30,84,153)" stroke-width="1.3"/><text x="880" y="172" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="rgb(20,60,110)">ESP DOMAIN</text><rect x="60" y="196" width="320" height="46" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="220" y="219" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="rgb(30,30,28)">Fuse / polyfuse</text><path d="M190,242 L190,256" stroke="rgb(120,118,112)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="256" r="3" fill="rgb(120,118,112)"/><path d="M190,256 L130,256 L130,270" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M190,256 L300,256 L300,270" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="270" width="130" height="52" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="130" y="296" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="rgb(30,30,28)">BEC 5A</text><text x="130" y="313" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="rgb(100,98,94)">12V→5V</text><line x1="119" y1="342" x2="141" y2="342" stroke="rgb(153,60,29)" stroke-width="2.2"/><line x1="119" y1="358" x2="141" y2="358" stroke="rgb(153,60,29)" stroke-width="2.2"/><line x1="130" y1="326" x2="130" y2="342" stroke="rgb(120,118,112)" stroke-width="2"/><line x1="130" y1="358" x2="130" y2="374" stroke="rgb(120,118,112)" stroke-width="2"/><rect x="139.1" y="341.5" width="77.8" height="17.0" rx="3" fill="white" opacity="0.95"/><text x="178" y="350" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="rgb(100,98,94)">1000µF cap</text><path d="M130,362 L130,376" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,270 L300,376" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="291.5" y="291.5" width="96.9" height="17.0" rx="3" fill="white" opacity="0.95"/><text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="rgb(100,98,94)">VM 12V direct</text><rect x="50" y="376" width="340" height="100" rx="12" fill="rgb(241,239,232)" stroke="rgb(153,60,29)" stroke-width="1.3"/><text x="220" y="400" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="rgb(113,43,19)">TB6612FNG motor driver</text><text x="130" y="424" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">VCC ← 5V (BEC)</text><text x="300" y="424" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">VM ← 12V direct</text><text x="220" y="450" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(100,98,94)">GND — common with ESP domain</text><path d="M130,476 L130,494" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,476 L310,494" stroke="rgb(120,118,112)" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="113.0" y="477.8" width="34.0" height="16.5" rx="3" fill="white" opacity="0.95"/><text x="130" y="486" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="rgb(100,98,94)">A</text><rect x="293.0" y="477.8" width="34.0" height="16.5" rx="3" fill="white" opacity="0.95"/><text x="310" y="486" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="rgb(100,98,94)">B</text><rect x="50" y="494" width="160" height="66" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="130" y="514" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="rgb(30,30,28)">Left motors ×2</text><text x="130" y="536" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="rgb(100,98,94)">(front + rear)</text><rect x="230" y="494" width="160" height="66" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1.3"/><text x="310" y="514" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="rgb(30,30,28)">Right motors ×2</text><text x="310" y="536" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="rgb(100,98,94)">(front + rear)</text><text x="220" y="594" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="rgb(113,43,19)">4× DC gear motors — 4WD tank drive</text><rect x="720" y="196" width="320" height="110" rx="12" fill="rgb(241,239,232)" stroke="rgb(30,84,153)" stroke-width="1.3"/><text x="880" y="222" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="rgb(20,60,110)">ESP32-S3-CAM / DevKit V1</text><text x="880" y="250" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="rgb(55,55,52)">6V → VIN / 5V pin (not 3V3)</text><text x="880" y="272" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="rgb(100,98,94)">onboard AMS1117-3.3 → 3.3V rail</text><text x="880" y="292" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="rgb(100,98,94)">input range 4.5–12V ✓</text><rect x="415" y="340" width="270" height="78" rx="10" fill="white" stroke="rgb(120,118,112)" stroke-width="1.3" stroke-dasharray="5 4"/><text x="550" y="362" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="rgb(30,30,28)">PWM / DIRECTION</text><text x="550" y="384" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="rgb(100,98,94)">PWMA·AIN1·AIN2·PWMB·BIN1·BIN2</text><text x="550" y="402" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="rgb(100,98,94)">signal only, low current</text><path d="M390,400 L415,380" stroke="rgb(120,118,112)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M685,380 L715,300" stroke="rgb(120,118,112)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="720" y="340" width="320" height="168" rx="12" fill="rgb(241,239,232)" stroke="rgb(30,84,153)" stroke-width="1"/><text x="880" y="364" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="rgb(20,60,110)">Wiring checklist</text><circle cx="748" cy="394" r="3" fill="rgb(30,84,153)"/><text x="762" y="394" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">VIN gets the 6V pack — never 3V3 directly</text><circle cx="748" cy="424" r="3" fill="rgb(30,84,153)"/><text x="762" y="424" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">GND shared with the motor domain (below)</text><circle cx="748" cy="454" r="3" fill="rgb(30,84,153)"/><text x="762" y="454" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">Separate pack — no shared rail with motors</text><circle cx="748" cy="484" r="3" fill="rgb(30,84,153)"/><text x="762" y="484" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">PWM/direction lines run to TB6612FNG only</text><path d="M190,628 L190,656" stroke="rgb(90,88,84)" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,628 L220,656" stroke="rgb(90,88,84)" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M880,508 L880,656" stroke="rgb(90,88,84)" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="180" y1="628" x2="200" y2="628" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="183.5" y1="633" x2="196.5" y2="633" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="187" y1="638" x2="193" y2="638" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="210" y1="628" x2="230" y2="628" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="213.5" y1="633" x2="226.5" y2="633" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="217" y1="638" x2="223" y2="638" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="870" y1="508" x2="890" y2="508" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="873.5" y1="513" x2="886.5" y2="513" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="877" y1="518" x2="883" y2="518" stroke="rgb(90,88,84)" stroke-width="2"/><line x1="60" y1="656" x2="1040" y2="656" stroke="rgb(90,88,84)" stroke-width="2.4"/><text x="550" y="680" text-anchor="middle" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="rgb(90,88,84)">COMMON GROUND — the only other link between the two domains</text><line x1="60" y1="698" x2="1040" y2="698" stroke="rgb(215,213,207)" stroke-width="1"/><path d="M60,720 L82,720" stroke="rgb(120,118,112)" stroke-width="2.6" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="720" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">power</text><path d="M220,720 L242,720" stroke="rgb(120,118,112)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="720" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="rgb(55,55,52)">signal</text><path d="M380,720 L402,720" stroke="rgb(90,88,84)" stroke-width="1.8" stroke-dasharray="3 3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="720" text-anchor="start" dominant-baseline="central" font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fon